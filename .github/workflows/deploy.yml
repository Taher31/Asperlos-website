name: Deploy to cPanel

# Builds the static site and uploads dist/ to the host over FTPS (ADR-0001).
# Required repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional secret: FTP_SERVER_DIR (defaults to public_html/)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test the FTP connection only; upload nothing'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Lists unconfirmed content ([TBD: …]) still on any page (docs/brand-guide.md).
      # Temporarily non-blocking: the owner chose to publish before all placeholders are filled.
      # Remove continue-on-error to block publishing again.
      - run: npm run check:placeholders
        if: ${{ !inputs.dry_run }}
        continue-on-error: true

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          dry-run: ${{ inputs.dry_run || false }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
