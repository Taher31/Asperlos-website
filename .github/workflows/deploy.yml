name: Deploy to cPanel

# Builds the static site and uploads dist/ to the host over FTPS (ADR-0001).
# Required repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional secret: FTP_SERVER_DIR (defaults to public_html/)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Blocks publishing while unconfirmed content ([TBD: …]) is still on any page (docs/brand-guide.md).
      - run: npm run check:placeholders

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
